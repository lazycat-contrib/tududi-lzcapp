params:
  - id: admin_email
    type: string
    name: Admin email
    description: "Email address used as the Tududi administrator login."
    default_value: "admin@example.com"
    optional: false
  - id: admin_password
    type: secret
    name: Admin password
    description: "Password for the Tududi administrator login, at least 12 characters."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_email:
      name: 管理员邮箱
      description: Tududi 的管理员登录邮箱。
    admin_password:
      name: 管理员密码
      description: Tududi 管理员登录密码，至少 12 位。默认随机生成，不存在内置弱口令。
