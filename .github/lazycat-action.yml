version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: tududi
build:
  toolchains: []
  run_buildscript: false
images:
  - id: tududi
    target: service
    service: tududi
    source: chrisvel/tududi
    channel: stable
    sort: semver
    # The repo carries 241 tags of which only 76 are plain three-part versions
    # (the rest are floating/shaded), so all three numeric segments are required.
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Tududi
    skip_if_version_exists: true
